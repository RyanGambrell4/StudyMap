name: Revenue smoke

# ─────────────────────────────────────────────────────────────────────────────
# DISABLED 2026-09-05. Do not re-enable without reading this.
#
# This workflow created REAL Stripe Checkout Sessions in LIVE MODE, four to six
# times a day, for three months.
#
#   first run   2026-06-09
#   last run    2026-09-06
#   464 runs    348 scheduled, 105 on push, 11 on pull_request
#   ~906 live-mode Checkout Sessions, two per run
#
# scripts/verify-trial-flow.mjs POSTs to https://getstudyedge.com/api/stripe,
# which holds sk_live_. There was never a test-mode path: the script has no
# flag for one and the production endpoint has no way to use a test key. So the
# answer to "did it ever run against test mode" is no, it could not have.
#
# Every session used an email of the form trial-verify+<epoch_ms>@getstudyedge.com,
# so they are exactly identifiable and can be excluded from analysis. They were
# never completed, so no card was charged and no revenue is affected. What IS
# affected is every conversion rate anyone has computed from Stripe: the
# denominator was mostly robot.
#
# It also kept requesting billingPeriod: 'weekly' after weekly was retired on
# 2026-08-30. ae7c02c updated this script's comments and its printed
# instructions to say monthly and left the two actual postCheckout() calls on
# weekly, which is why sessions kept appearing against a dead price ID.
#
# ── the workflow was not wrong to exist ──────────────────────────────────────
# On 2026-05-25 a one-line commit silently disabled the trial flow and nobody
# noticed for nine days. That is a real failure mode and it deserves a guard.
# The guard just has to not transact.
#
# ── what a safe version needs ────────────────────────────────────────────────
# Any of these, in rough order of effort:
#
#   1. A test-mode path end to end. /api/stripe would need to accept a
#      caller-supplied mode, or a sibling endpoint gated on a shared secret
#      would need to use STRIPE_SECRET_KEY_TEST. Then the smoke test proves the
#      same thing against sk_test_ and creates nothing billable.
#   2. Assert without transacting. Most of the 2026-05-25 failure is visible
#      without creating a session at all: that /api/stripe returns 200 and a
#      checkout.stripe.com URL for a dry-run request the endpoint declines to
#      persist.
#   3. If neither, run it manually before a release, not on a timer.
#
# Until one of those exists this file stays disabled. `on: workflow_dispatch`
# is deliberately the ONLY trigger, and the script itself now refuses live mode
# unless explicitly forced, so dispatching it by accident still creates nothing.
# ─────────────────────────────────────────────────────────────────────────────

on:
  # No schedule. No push. No pull_request. See the note above.
  workflow_dispatch:
    inputs:
      i_understand_this_creates_live_stripe_sessions:
        description: 'Type CREATE-LIVE-SESSIONS to confirm. Anything else and the script refuses.'
        required: true
        default: 'no'

jobs:
  trial-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify trial -> Stripe Checkout
        env:
          ALLOW_LIVE_CHECKOUT: ${{ inputs.i_understand_this_creates_live_stripe_sessions }}
        run: node scripts/verify-trial-flow.mjs --base=https://getstudyedge.com

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Trial -> Stripe Checkout flow is broken on production."
          echo "::error::This is the exact failure mode that caused the 2026-05-25 incident."
          echo "::error::Drive https://getstudyedge.com/app?signup=1&plan=pro&billing=monthly&trial=1 manually NOW."
